name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out private submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.URSATZ_SUBMODULE_TOKEN }}@github.com/Mitchell-Opitz/Ursatz".insteadOf "https://github.com/Mitchell-Opitz/Ursatz"
          git submodule update --init --recursive

      - name: Check submodule pins
        run: scripts/check-pins.sh

      - name: Install dependencies
        run: |
          dpkg -s libsqlite3-dev pkg-config > /dev/null 2>&1 ||
            sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      - name: Cache compiler output
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Configure
        # The Composer's own build tree inherits the launcher from the environment.
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
