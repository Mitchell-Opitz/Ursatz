name: Nightly

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full suite of every part, slow tests included.
  full-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [library, analyzer, composer, gui]
    name: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dpkg -s libsqlite3-dev pkg-config > /dev/null 2>&1 ||
            sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ matrix.part }}

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build/${{ matrix.part }} --output-on-failure --no-tests=error -j$(nproc)
      - name: Ten slowest tests
        if: always()
        working-directory: ${{ matrix.part }}
        run: bash scripts/slowest-tests.sh ../build/${{ matrix.part }}
