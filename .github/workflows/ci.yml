name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs
        run: |
          for part in library analyzer composer gui; do
            bash tools/ci/check-docs.sh "$part"
          done

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y python3-jsonschema

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake -S . -B build -DURSATZ_REQUIRE="jsonschema;node"

      - name: Build
        run: cmake --build build -j

      # Boundary checks, run from the repository root against the build.
      - name: Check file scope state
        run: bash tools/ci/check-statics.sh analyzer composer
      - name: Check that music is heard through the Analyzer
        run: bash tools/ci/check-hearing.sh
      - name: Check frontend theory
        run: bash tools/ci/check-frontend-theory.sh
      - name: Reach scan (every function reached by an application)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: bash tools/ci/check-reach.sh build-reach

      - name: Test (fast set)
        run: ctest --test-dir build --output-on-failure --no-tests=error -j$(nproc) -LE slow
      - name: Ten slowest tests
        if: always()
        run: bash tools/ci/slowest-tests.sh build

      # The fast set runs accuracy_harness, which writes the report.
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: |
            build/library/tests/accuracy/report.md
            build/library/tests/accuracy/report.json
