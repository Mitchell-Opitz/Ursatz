name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs
        run: |
          for part in library analyzer composer gui; do
            bash tools/ci/check-docs.sh "$part"
          done

      - name: Install dependencies
        run: |
          dpkg -s libsqlite3-dev pkg-config > /dev/null 2>&1 ||
            sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      # Boundary checks, run from the repository root against the build.
      - name: Check Analyzer library includes
        run: bash tools/ci/check-library-includes-analyzer.sh build
      - name: Check Composer library includes
        run: bash tools/ci/check-library-includes-composer.sh build
      - name: Check GUI library includes
        run: bash tools/ci/check-library-includes-gui.sh build
      - name: Check chain builds
        run: bash tools/ci/check-chain-builds.sh
      - name: Check that the CLI includes only the composer API
        run: bash tools/ci/check-cli-api.sh
      - name: Check file scope state
        run: bash tools/ci/check-statics.sh analyzer composer
      - name: Check that API internals stay in the API layer
        run: bash tools/ci/check-layers.sh
      - name: Check that music is heard through the Analyzer
        run: bash tools/ci/check-hearing.sh
      - name: Check frontend theory
        run: bash tools/ci/check-frontend-theory.sh

      - name: Test (fast set)
        run: ctest --test-dir build --output-on-failure --no-tests=error -j$(nproc) -LE slow
      - name: Ten slowest tests
        if: always()
        run: bash tools/ci/slowest-tests.sh build

      - name: Accuracy gate
        run: ./build/library/tests/accuracy/accuracy_harness
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: |
            build/library/tests/accuracy/report.md
            build/library/tests/accuracy/report.json
