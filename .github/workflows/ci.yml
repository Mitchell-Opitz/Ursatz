name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ${{ runner.os }}-ccache

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y python3-jsonschema

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake -S . -B build -DURSATZ_REQUIRE="jsonschema;node"

      - name: Build
        run: cmake --build build -j

      # The docs, statics, hearing, primitives and frontend theory checks run as tests in the fast set (tests/CMakeLists.txt); the reach scan is
      # slow there, so CI runs it here with ccache.
      - name: Reach scan (every function reached by an application)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: bash tools/ci/check-reach.sh build-reach

      - name: Test (fast set)
        run: ctest --test-dir build --output-on-failure --no-tests=error -j$(nproc) -LE slow
      - name: Ten slowest tests
        if: always()
        run: bash tools/ci/slowest-tests.sh build

      # The fast set runs accuracy_harness, which writes the report.
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accuracy-report
          path: |
            build/library/tests/accuracy/report.md
            build/library/tests/accuracy/report.json
