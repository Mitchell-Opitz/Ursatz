name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.URSATZ_SUBMODULE_TOKEN }}@github.com/Mitchell-Opitz/Ursatz".insteadOf "https://github.com/Mitchell-Opitz/Ursatz"
          git submodule update --init --recursive
      - name: Check submodule pins
        run: scripts/check-pins.sh
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Check library includes
        run: scripts/check-library-includes.sh build
      - name: Check chain builds
        run: scripts/check-chain-builds.sh
      - name: Check file scope state
        run: scripts/check-statics.sh
      - name: Test
        run: ctest --test-dir build --output-on-failure
