name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.URSATZ_SUBMODULE_TOKEN }}@github.com/Mitchell-Opitz/Ursatz".insteadOf "https://github.com/Mitchell-Opitz/Ursatz"
          git submodule update --init --recursive
      - name: Check submodule pins
        run: scripts/check-pins.sh
      - name: Check docs
        run: bash scripts/check-docs.sh
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache
      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j
      - name: Check library includes
        run: scripts/check-library-includes.sh build
      - name: Check chain builds
        run: scripts/check-chain-builds.sh
      - name: Check file scope state
        run: scripts/check-statics.sh
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j$(nproc) -LE slow
